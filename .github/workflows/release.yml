# Release pipeline. Triggered by pushing a tag matching `v*` (e.g. `v0.1.1`).
#
# Builds installers for Windows (NSIS), macOS (DMG, Apple Silicon only), and
# Linux (AppImage), signs them with the Tauri updater key, and drafts a
# GitHub Release with the artefacts attached. Publishing the release is
# manual — review the draft on github.com/.../releases first.
#
# The in-app updater reads the published release's `latest.json`. Until the
# draft is published, no client will see the update.
#
# macOS note: builds are NOT code-signed. First launch shows "can't be
# opened because Apple cannot check it for malicious software" — user must
# right-click → Open the first time. Pay $99/year for an Apple Developer
# account to remove that prompt; this workflow is otherwise ready for it
# (add APPLE_* secrets and tauri-action picks them up).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # also allow manual runs from the Actions tab

jobs:
  build-tauri:
    permissions:
      contents: write # required to draft/upload to a Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis,updater"
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-14   # Apple Silicon runner
            args: "--target aarch64-apple-darwin --bundles dmg,updater"
            rust_target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: "--bundles appimage,updater"
            rust_target: ""        # native, no override

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux build deps: WebKitGTK, GTK, librsvg, AppImage tooling.
      # Skipped on Windows/macOS where everything ships with the runner.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — required because createUpdaterArtifacts
          # is true in tauri.conf.json. Without these env vars the bundler
          # fails the build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TSIA ${{ github.ref_name }}"
          releaseBody: |
            ## Installation

            **Windows**: Download the `.exe` and run it. SmartScreen may
            warn "Unknown publisher" — click **More info → Run anyway**.

            **macOS** (Apple Silicon): Download the `.dmg`, open it, drag
            the app to Applications. First launch: right-click the app
            and choose **Open** (Gatekeeper blocks unsigned apps from
            normal double-click).

            **Linux**: Download the `.AppImage`, mark it executable
            (`chmod +x`), run.

            Updates after first install are in-app — a banner appears
            when a new version is available.
          releaseDraft: true        # publish manually after sanity check
          prerelease: false
          args: ${{ matrix.args }}
